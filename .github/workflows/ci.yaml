name : CI

on : 
  push : 
    branches:
      - Development
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on : ubantu-latest

    setups :
      - name: checkout code
        uses: actions/checkout@v4

      - name : setup python 
        uses : actions/setup-python@v5
        with :
          python-version: 3.14.3

      - name : Install UV
        runs : astral-sh/setup-uv@v5

      - name : Install Dependencies 
        runs : |
          uv sync

      - name : Run tests
        runs : |
          uv run pytest 
