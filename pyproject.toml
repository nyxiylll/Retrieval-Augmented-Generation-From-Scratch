[project]
name = "retrieval-augmented-generation-from-scratch"
version = "0.1.0"
description = "Retrieval-Augmented Generation (RAG) built from scratch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.4.9",
    "chromadb>=1.5.9",
    "groq>=0.28.0",
    "openai>=2.52.0",
    "psycopg-pool>=3.3.1",
    "psycopg2>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.1.0",
    "sentence-transformers>=5.6.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
